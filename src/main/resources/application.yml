spring:
  application:
    name: BaseEcommerceSpring
  datasource:
    # Criar ficheiro .env
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Em produção, colocar em validate
      ddl-auto: update
  # Colocar throw e add-mappings devido ao handleNoHandlerFound (404)
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mapping: false