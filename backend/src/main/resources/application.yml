spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: base.ecommerce.spring.react

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

# Talvez depois remover
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
