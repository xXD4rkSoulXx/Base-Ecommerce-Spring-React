spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: base.ecommerce.spring.react
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  simulation:
    enabled: ${SIMULATION_ENABLED}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    url: ${FRONTEND_URL}
  backend:
    url: ${BACKEND_URL}
  storage:
    upload-dir: uploads
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    currency: ${STRIPE_CURRENCY}
  shippo:
    api-key: ${SHIPPO_API_KEY}
    base-url: ${SHIPPO_BASE_URL}

shipping:
  origin:
    name: "VELO_CITI"
    address-line-1: "Unter den Linden 77"
    city: "Berlin"
    state: ""
    postal-code: "10117"
    country: "DE"
    phone: "+49301234567"
  packing:
    boxes:
      - name: "Small"
        max-weight-kg: 2
        length-cm: 20
        width-cm: 15
        height-cm: 10
      - name: "Medium"
        max-weight-kg: 5
        length-cm: 35
        width-cm: 25
        height-cm: 15
      - name: "Big"
        max-weight-kg: 10
        length-cm: 45
        width-cm: 35
        height-cm: 25
